<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d12">
<title>The Enlightenment Engine</title>
<meta name="description" content="A small game about sitting still, and everything you'll build to avoid it.">
<link rel="canonical" href="https://www.bulutk.com/enlightenment-engine/next/">
<meta property="og:type" content="website">
<meta property="og:title" content="The Enlightenment Engine">
<meta property="og:description" content="A small game about sitting still, and everything you'll build to avoid it.">
<meta property="og:url" content="https://www.bulutk.com/enlightenment-engine/next/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0d12'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f2b866' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="intro">

  <header id="hdr">
    <span class="h-title" id="hTitle"></span>
    <span class="h-day" id="hDay"></span>
    <span class="h-gap"></span>
    <button type="button" class="quiet" id="sndBtn"></button>
    <button type="button" class="quiet" id="menuBtn"></button>
  </header>

  <main id="main">
    <section id="stage" aria-label="The room">
      <canvas id="cv"></canvas>
      <div id="fallback" hidden><div class="fb-still"></div><div class="fb-ring"></div></div>
      <div id="dim"></div>
      <div id="actTitle"></div>
      <div id="bigCount" hidden></div>
      <div id="voice" aria-live="polite"><div class="plate"><p class="v-text"></p></div></div>
      <div id="floats" aria-hidden="true"></div>
      <div id="now" aria-hidden="true"></div>
      <button type="button" id="ring"></button>
      <div id="under">
        <div id="verb"></div>
        <div id="pips" hidden></div>
        <div id="onword" aria-hidden="true"></div>
        <div id="change" aria-hidden="true"></div>
      </div>
      <div id="orbs"></div>
      <div id="reader" hidden></div>
      <div id="cards"></div>
      <div id="legend"></div>
      <div id="caption" aria-live="off"><p></p></div>
      <div id="titleCard" hidden></div>
    </section>

    <aside id="side">
      <div id="sideTop">
        <section id="resources" aria-label="What you have"></section>
        <div id="chips"></div>
        <div id="panels"></div>
      </div>
      <section id="journal" hidden>
        <h2 class="label" id="jLabel"></h2>
        <div class="j-hint" id="jHint" hidden></div>
        <div id="jList" aria-live="polite"></div>
      </section>
      <section id="finalPanel" hidden></section>
    </aside>
  </main>

  <div id="intro"></div>
  <nav id="langs" aria-label="Language"></nav>
  <div id="overlay" hidden></div>
  <div id="dev" hidden></div>
</div>

<script src="js/track.js"></script>
<script src="js/story.js"></script>
<script src="js/story.launch.js"></script>
<script src="js/lang.js"></script>
<script src="js/data.js"></script>
<script src="js/economy.js"></script>
<script src="js/director.js"></script>
<script src="js/visual.js" onerror="window.EE_NO_VISUAL=true"></script>
<script src="js/audio.js" onerror="window.EE_NO_AUDIO=true"></script>
<script src="js/ui.js"></script>
<script src="js/keep.js"></script>
<script src="js/game.js"></script>
</body>
</html>
