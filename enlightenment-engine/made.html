<style>
  /* "How this was made": the game's look (dark paper, the narrator's serif), one narrow column that scrolls */
  html, body { height: auto; min-height: 100%; }
  body { overflow: auto; background: radial-gradient(ellipse at 50% -10%, rgba(242, 184, 102, 0.06), transparent 60%), var(--night); }
  .made { max-width: 34em; margin: 0 auto; padding: 76px 22px 96px; animation: rise 1.4s ease both; }
  .made .kicker { text-align: center; }
  .made h1 { margin: 10px 0 0; text-align: center; font-weight: 400; font-style: italic; font-size: clamp(1.7rem, 5vw, 2.2rem); line-height: 1.2; }
  .made .rule { width: 40px; height: 1px; background: var(--ink-faint); margin: 24px auto 34px; }
  .made section { margin: 0 0 34px; }
  .made h2 { margin: 0 0 12px; }
  .made p { margin: 0 0 14px; font-size: 1.06rem; line-height: 1.65; color: rgba(233, 228, 216, 0.86); }
  .made .shot { margin: 26px auto 10px; max-width: 720px; }
  .made .shot img { display: block; width: 100%; height: auto; border: 1px solid rgba(233, 228, 216, 0.22); border-radius: 2px; }
  .made .shot figcaption { margin-top: 8px; font-size: 0.8rem; font-style: italic; color: var(--ink-faint); text-align: center; }
  .made .shot-link { text-align: center; font-size: 0.9rem; margin: 0 0 22px; }
  @media (min-width: 900px) { .made .shot { margin-left: -6em; margin-right: -6em; } }
  .made .lang-note { font-size: 0.86rem; font-style: italic; color: var(--ink-faint); text-align: center; margin-top: 40px; }
  .made a { color: var(--ink-dim); text-underline-offset: 3px; text-decoration-color: rgba(233, 228, 216, 0.3); }
  .made a:hover { color: var(--ink); }
  .made .back { margin-top: 48px; text-align: center; }
  .made .back a { display: inline-block; padding: 9px 18px; border: 1px solid rgba(233, 228, 216, 0.4); border-radius: 2px; text-decoration: none; font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); }
  .made .back a:hover, .made .back a:focus-visible { border-color: var(--amber); background: rgba(242, 184, 102, 0.07); }
  :root[data-cjk] .made .back a { letter-spacing: 0.04em; }
